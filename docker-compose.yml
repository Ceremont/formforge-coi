services:
  formforge:
    image: formforge-coi:1.1.0
    build: .
    init: true
    environment:
      FORMFORGE_MAX_UPLOAD_MB: ${FORMFORGE_MAX_UPLOAD_MB:-20}
      FORMFORGE_PROCESSING_TIMEOUT: ${FORMFORGE_PROCESSING_TIMEOUT:-90}
      FORMFORGE_MAX_PAGES: ${FORMFORGE_MAX_PAGES:-30}
      FORMFORGE_MAX_CELLS: ${FORMFORGE_MAX_CELLS:-30000}
      FORMFORGE_MAX_BLOCKS: ${FORMFORGE_MAX_BLOCKS:-12000}
      FORMFORGE_MAX_UNCOMPRESSED_MB: ${FORMFORGE_MAX_UNCOMPRESSED_MB:-80}
      FORMFORGE_MAX_IMAGE_PIXELS: ${FORMFORGE_MAX_IMAGE_PIXELS:-25000000}
      FORMFORGE_MAX_SOURCE_IMAGE_PIXELS: ${FORMFORGE_MAX_SOURCE_IMAGE_PIXELS:-80000000}
      FORMFORGE_EXPORT_FORMAT: ${FORMFORGE_EXPORT_FORMAT:-official}
      FORMFORGE_WORKER_MEMORY_MB: ${FORMFORGE_WORKER_MEMORY_MB:-768}
      FORMFORGE_MAX_WORKERS: ${FORMFORGE_MAX_WORKERS:-2}
      FORMFORGE_OCR_LANGUAGES: ${FORMFORGE_OCR_LANGUAGES:-pol+eng}
      FORMFORGE_OCR_TIMEOUT: ${FORMFORGE_OCR_TIMEOUT:-25}
      FORMFORGE_OCR_VARIANTS: ${FORMFORGE_OCR_VARIANTS:-3}
      FORMFORGE_ANALYSIS_MODE: ${FORMFORGE_ANALYSIS_MODE:-deterministic}
      FORMFORGE_LOCAL_MODEL_PATH: ${FORMFORGE_LOCAL_MODEL_PATH:-}
      FORMFORGE_DICTIONARY_REGISTRY_PATH: ${FORMFORGE_DICTIONARY_REGISTRY_PATH:-}
      FORMFORGE_AUTH_ENABLED: ${FORMFORGE_AUTH_ENABLED:-false}
      FORMFORGE_JWT_SECRET: ${FORMFORGE_JWT_SECRET:-}
      FORMFORGE_JWT_ISSUER: ${FORMFORGE_JWT_ISSUER:-formforge}
      FORMFORGE_JWT_AUDIENCE: ${FORMFORGE_JWT_AUDIENCE:-formforge-api}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    networks: [offline]

  gateway:
    image: formforge-coi:1.1.0
    init: true
    entrypoint: ["python", "/app/deploy/gateway.py"]
    ports:
      - "127.0.0.1:${FORMFORGE_HTTP_PORT:-8000}:8000"
    environment:
      FORMFORGE_MAX_UPLOAD_MB: ${FORMFORGE_MAX_UPLOAD_MB:-20}
      FORMFORGE_PROCESSING_TIMEOUT: ${FORMFORGE_PROCESSING_TIMEOUT:-90}
    depends_on:
      formforge:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    networks: [ingress, offline]

networks:
  ingress:
  offline:
    internal: true
