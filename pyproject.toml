[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "formforge-coi"
version = "0.4.0"
description = "Offline government document to eForm MVP"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "fastapi==0.165.0", "uvicorn==0.54.0", "pydantic==2.14.4",
  "pydantic-settings==2.16.3", "python-multipart==0.0.34",
  "pypdf==7.1.1", "pypdfium2==5.15.2", "python-docx==1.2.0",
  "openpyxl==3.1.5", "odfpy==1.4.1", "Pillow==13.0.0",
  "pytesseract==0.3.13", "Jinja2==3.1.6", "PyJWT==2.15.1",
  "defusedxml==0.7.1",
  "jsonschema==4.26.0",
  "jsonata-python==0.7.1",
  "olefile==0.47",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "reportlab==5.1.0", "ruff==0.17.6", "pip-licenses==5.5.5"]

[tool.setuptools.packages.find]
include = ["formforge*"]

[tool.setuptools.package-data]
formforge = ["templates/*.html", "static/*", "static/vendor/swagger-ui/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ocr: requires a real local Tesseract installation"]

[tool.ruff]
target-version = "py314"
line-length = 180

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
